# NG23 — CI pipeline: install → lint → word-list → auth-schema parity →
# check → unit tests → build → types:check → bundle-secrecy proof → e2e
# (Playwright). All DB-dependent integration tests run against a
# NON-production database (credentials injected as GitHub secrets; see B6
# integration job extension — the DB gate is MANDATORY and fails when the
# secret is missing).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint (ESLint flat config)
        run: bun run lint
      - name: Word-list artifact (src/lib/shared/data/valid-guesses.json)
        run: bun run word-list
      - name: Word-list artifacts match the committed files (no silent drift)
        # The generator is deterministic; if a stale artifact were committed
        # the regeneration would change it here — fail loudly instead.
        run: git diff --exit-code -- src/lib/shared/data/valid-guesses.json src/server/data/valid-guesses.generated.ts
      - name: Auth schema parity (pinned `auth` CLI regeneration)
        # Regenerates src/server/db/auth-schema.generated.ts with the pinned
        # CLI (auth@1.7.1 in bun.lock) and fails on any real drift — the
        # generator must stay reproducible (Phase-0 post-check finding).
        run: bun run auth:check
      - name: Typecheck
        run: bun run check
      - name: Unit tests (no DB)
        run: bun run test:unit
      - name: Production build (Cloudflare Workers)
        run: bun run build
      # types:check compares against the committed worker-configuration.d.ts,
      # whose Cloudflare.GlobalProps.mainModule block is only emitted when
      # .svelte-kit/cloudflare/_worker.js exists (post-build) — on a fresh
      # checkout the hash+content differ and the check would fail. Kept AFTER
      # the build by design (wrangler 4.125.0 behavior, verified 2026-08-23).
      - name: Wrangler types in sync (wrangler.toml ↔ worker-configuration.d.ts)
        run: bun run types:check
      - name: Answer-pool secrecy proof (absent from build output)
        run: bun run verify:bundle

  integration:
    runs-on: ubuntu-latest
    needs: unit-and-build
    # B6/B7 external gate — runs the DB integration suite (migration applied
    # first) against a NON-production database; exercises the app's real
    # neon-serverless driver path. FINAL Phase-0 policy: the integration gate
    # is MANDATORY. If the non-production DATABASE_URL secret is not
    # configured the job FAILS — DB verification must never silently skip.
    #
    # Context rules (docs.github.com contexts reference): `secrets` and `env`
    # are NOT available in `jobs.<job_id>.if` (only github/needs/vars/inputs).
    # `secrets` IS available in job-level `env`, and `env` IS available in
    # step-level `if` — so the secret is injected as a job env var and the
    # gate lives on the DB steps. Without the secret the guard step fails the
    # job explicitly (no silent skip; fork PRs without the secret fail loudly
    # so the missing gate cannot be mistaken for a pass).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Fail if DATABASE_URL secret is not configured (mandatory DB gate)
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::DATABASE_URL non-production secret is required for the mandatory integration gate (Phase-0 B6/B7 policy). Configure it in the repository secrets, or the DB verification is lost."
          exit 1
      # Redacted connection diagnostics: URL facts (no credentials) + the pg
      # driver error (code + first line). Fails before the migration so the
      # runner log carries the actual cause (run-3 failure surfaced no message
      # between 'Using pg driver' and the exit).
      - name: DB connection probe (redacted diagnostics)
        if: ${{ env.DATABASE_URL != '' }}
        run: bun ./scripts/ci-db-probe.ts
      - name: Apply migrations (non-production database)
        # programmatic migrator — drizzle-kit CLI exits 1 silently on this
        # runner (~140ms after 'Using pg driver', no message); ci-migrate.ts
        # prints the real error/stack if anything fails.
        if: ${{ env.DATABASE_URL != '' }}
        run: bun ./scripts/ci-migrate.ts
      - name: Integration tests (FOR UPDATE, NG9 lock orders, M3, NG2/NG3)
        if: ${{ env.DATABASE_URL != '' }}
        run: bun run test:integration

  e2e:
    runs-on: ubuntu-latest
    # Serialized AFTER integration: both jobs TRUNCATE the app tables on the
    # same non-production database — running them in parallel would race the
    # fixtures (a job can wipe the other's rows mid-run).
    needs: [unit-and-build, integration]
    # Phase-1: the authenticated gameplay spec uses the deterministic session
    # fixture (tests/e2e/helpers/auth-fixture.ts) — real user+session rows on
    # the non-production DB and the exact Better Auth signed cookie, so no
    # live Google OAuth round-trip. When these secrets are configured the
    # full gameplay flow runs; without them the spec skips explicitly (the
    # unauthenticated smoke spec always runs). The integration job above is
    # the MANDATORY DB gate; this one stays green either way.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      # Explicit opt-in for the authenticated fixture, which TRUNCATEs the
      # app tables on the designated non-production database (see
      # tests/e2e/helpers/auth-fixture.ts).
      ALLOW_DB_WIPE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: E2E smoke (production preview → Hono chain)
        run: bun run test:e2e