# NG23 — CI pipeline: install → lint → word-list → auth-schema parity →
# check → unit tests → build → types:check → bundle-secrecy proof → e2e
# (Playwright). DB suites (CI-7, 2026-09-06):
#   - integration: MANDATORY DB gate (Phase-0 B6/B7) against an EPHEMERAL
#     postgres service container (LOCAL_PG=1, node-postgres harness seam) —
#     no secrets, no shared-DB races, no per-query network RTT;
#   - e2e: the ONLY suite on the shared non-production Neon (real
#     neon-serverless driver path + session fixture); mutex-protected (CI-2);
#   - smoke: DB-free Playwright project, own job, runs in parallel.
# Both DB jobs stay gated to main pushes (CI-3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# S6c — minimum token scope for all three jobs (contents: read; nothing in
# these jobs writes back to the repository).
permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Dependency audit (bun audit — HIGH+ fails; documented allowlist)
        # S6a — the ONE scanner (Architecture supply-chain rule). Fails
        # the job when any HIGH/CRITICAL advisory exists for the installed
        # graph. Allowlist (never silent): append `--ignore GHSA-…` entries
        # here WITH a one-line rationale. Verified green on the Phase-5 tree.
        run: bun audit --audit-level=high
      - name: Lint (ESLint flat config)
        run: bun run lint
      - name: Word-list artifact (src/lib/shared/data/valid-guesses.json)
        run: bun run word-list
      - name: Word-list artifacts match the committed files (no silent drift)
        # The generator is deterministic; if a stale artifact were committed
        # the regeneration would change it here — fail loudly instead.
        run: git diff --exit-code -- src/lib/shared/data/valid-guesses.json src/server/data/valid-guesses.generated.ts
      - name: Avatar-list artifact (src/lib/shared/config/avatar-emojis.generated.ts)
        # Phase-2 D4: mirrors the word-list pipeline — regeneration must be
        # byte-identical to the committed client artifact.
        run: bun run avatar-list
      - name: Avatar-list artifact matches the committed file (no silent drift)
        run: git diff --exit-code -- src/lib/shared/config/avatar-emojis.generated.ts
      - name: Auth schema parity (pinned `auth` CLI regeneration)
        # Regenerates src/server/db/auth-schema.generated.ts with the pinned
        # CLI (auth@1.7.1 in bun.lock) and fails on any real drift — the
        # generator must stay reproducible (Phase-0 post-check finding).
        run: bun run auth:check
      - name: Typecheck
        run: bun run check
      - name: Unit tests (no DB)
        run: bun run test:unit
      - name: Production build (Cloudflare Workers)
        run: bun run build
      # Phase-3 D1 — the schema/migrations must be byte-identical to the
      # baseline (zero migration). Any drift fails loudly here (mirrors the
      # local gate `git diff --exit-code -- src/server/db/schema.ts src/server/db/migrations`).
      - name: Schema purity (Phase 3 — zero migration)
        run: git diff --exit-code -- src/server/db/schema.ts src/server/db/migrations
      # Phase-3 D8 — the vite closeBundle hook appends the cron `scheduled`
      # export post-build; without this assertion a missed hookup silently
      # ships a cron-less worker (plan §12).
      - name: Patched-worker assertion (cron `scheduled` export present)
        run: grep -q "export { scheduled }" .svelte-kit/cloudflare/_worker.js
      # types:check compares against the committed worker-configuration.d.ts,
      # whose Cloudflare.GlobalProps.mainModule block is only emitted when
      # .svelte-kit/cloudflare/_worker.js exists (post-build) — on a fresh
      # checkout the hash+content differ and the check would fail. Kept AFTER
      # the build by design (wrangler 4.125.0 behavior, verified 2026-08-23).
      - name: Wrangler types in sync (wrangler.toml ↔ worker-configuration.d.ts)
        run: bun run types:check
      - name: Answer-pool secrecy proof (absent from build output)
        run: bun run verify:bundle

  integration:
    runs-on: ubuntu-latest
    needs: unit-and-build
    # CI-7 (2026-09-06) — the integration suite runs against an EPHEMERAL
    # postgres service container on the runner instead of the shared
    # non-production Neon: per-query network RTT disappears (the old
    # Neon-Singapore round-trips roughly doubled suite latency — see the
    # vitest 60s-timeout comment), the shared-DB wipe race is gone, and the
    # MANDATORY DB gate (Phase-0 B6/B7) no longer depends on a secret — it
    # can never silently skip. Neon-WebSocket transport verification (B7)
    # remains covered by the e2e job, which still runs the real app against
    # the shared Neon on main pushes. Only main pushes execute this job
    # (CI-3 discipline, unchanged).
    if: github.event_name == 'push'
    # PostgreSQL 16 — the Neon-equivalent major (matching the schema the
    # suites assert against in production). The harness switches to the
    # node-postgres driver with LOCAL_PG=1 (tests/integration/helpers.ts);
    # the probe + migration scripts are already pg-based (scripts/ci-db-probe.ts,
    # scripts/ci-migrate.ts), so no test code changes were needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      LOCAL_PG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      # Redacted connection diagnostics: URL facts (no credentials) + the pg
      # driver error (code + first line). Fails before the migration so the
      # runner log carries the actual cause (run-3 failure surfaced no message
      # between 'Using pg driver' and the exit).
      - name: DB connection probe (redacted diagnostics)
        run: bun ./scripts/ci-db-probe.ts
      - name: Apply migrations (ephemeral job-local postgres)
        # programmatic migrator — drizzle-kit CLI exits 1 silently on this
        # runner (~140ms after 'Using pg driver', no message); ci-migrate.ts
        # prints the real error/stack if anything fails.
        run: bun ./scripts/ci-migrate.ts
      - name: Integration tests (FOR UPDATE, NG9 lock orders, M3, NG2/NG3)
        run: bun run test:integration

  e2e:
    runs-on: ubuntu-latest
    # CI-3/CI-7 (2026-09-06) — only main pushes run the DB-truncating e2e
    # suite against the shared non-production Neon (a dependabot/PR run
    # wiped a concurrent main-push integration run — contradictions log
    # CI-1). The integration job now uses an EPHEMERAL job-local postgres,
    # so e2e is the ONLY consumer of the shared DB: no serialization needed,
    # this job runs in parallel with integration + smoke. Concurrent runs of
    # THIS job are still protected by the advisory-lock mutex (CI-2) — the
    # lock fails loudly after 300 s instead of wiping each other.
    if: github.event_name == 'push'
    needs: unit-and-build
    # CI-13 — the workflow-wide `permissions: contents: read` leaves the
    # `actions` scope unset, but actions/upload-artifact@v4 needs
    # `actions: write` on the GITHUB_TOKEN to create run artifacts. Job-level
    # permissions REPLACE the workflow defaults, so `contents: read` must be
    # re-declared here for actions/checkout. Scoped to this job — the only
    # uploader in the workflow.
    permissions:
      contents: read
      actions: write
    # Phase-1: the authenticated gameplay spec uses the deterministic session
    # fixture (tests/e2e/helpers/auth-fixture.ts) — real user+session rows on
    # the non-production DB and the exact Better Auth signed cookie, so no
    # live Google OAuth round-trip. CI-9 (2026-09-06): the fixture env is a
    # MANDATORY gate — without DATABASE_URL + BETTER_AUTH_SECRET the
    # authenticated specs would SKIP silently (41/43 + the B7 real-Neon-
    # transport verification would be lost), so this job FAILS LOUDLY via
    # the guard step below instead of reporting a hollow green (explicit
    # skip stays the LOCAL-dev behavior). ALLOW_DB_WIPE is a hardcoded
    # constant in this job env. The DB-free smoke spec lives in its own job
    # (project 'smoke'); the mandatory Postgres-semantics gate is the
    # integration job (ephemeral postgres, CI-7).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      # Explicit opt-in for the authenticated fixture, which TRUNCATEs the
      # app tables on the designated non-production database (see
      # tests/e2e/helpers/auth-fixture.ts).
      ALLOW_DB_WIPE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      # CI-9/CI-10 — the fixture env is a MANDATORY gate: `secrets` are not
      # available in `jobs.<job_id>.if`, so they are injected as job env
      # vars and checked here (CI-9 — a silent skip would be a hollow green).
      # NOTE (CI-10): job env reaches ONLY the Playwright process — the
      # adapter-cloudflare PREVIEW server builds event.platform.env via
      # wrangler's getPlatformProxy, which loads wrangler.toml [vars] + the
      # gitignored .dev.vars FILE, so without the materialization step below
      # every authenticated request 500s ('BETTER_AUTH_SECRET is required')
      # — first real-with-secret run, 2026-09-06.
      - name: Fail if the auth-fixture env is incomplete (mandatory e2e gate)
        if: ${{ env.DATABASE_URL == '' || env.BETTER_AUTH_SECRET == '' }}
        run: |
          echo "::error::The e2e authenticated-fixture gate needs DATABASE_URL and BETTER_AUTH_SECRET repository secrets. Without them 41/43 e2e specs SKIP silently on every main push and the B7 real-Neon-WebSocket transport verification is lost. Configure non-empty secrets (ALLOW_DB_WIPE is hardcoded to 'true' in this job), or the e2e job fails here on purpose — a green checkmark must always mean the authenticated suite actually ran."
          exit 1
      # CI-10 — materialize the secrets the way LOCAL runs have them: the
      # preview server's platform env comes from wrangler's getPlatformProxy
      # (wrangler.toml vars + .dev.vars), NOT from process env. Quoted 'EOF'
      # keeps the values literal even if a secret contains '$' or '\'.
      # .dev.vars is gitignored; the runner is ephemeral.
      - name: Materialize .dev.vars for the preview platform proxy (CI-10)
        run: |
          cat > .dev.vars <<'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          EOF
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      # CI-7 — the DB-free smoke spec runs in its OWN job (project 'smoke');
      # this job keeps only the DB-touching specs via the 'app' project.
      - name: E2E suites (production preview → Hono chain)
        run: bun run test:e2e:app
      # CI-13 — Playwright's `trace: 'retain-on-failure'` (playwright.config.ts)
      # already persists error-context.md + trace.zip per failing test under
      # test-results/, but nothing uploaded them: the E7 failure run (#45)
      # shipped 0 artifacts, so the trace the CI-11 record says to pull
      # BEFORE touching gameplay code was lost with the ephemeral runner.
      # Diagnostic-only — uploads ONLY on failure (a green suite has no
      # test-results worth shipping); no test or application code changes.
      - name: Upload Playwright failure artifacts (traces + error-context)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  smoke:
    runs-on: ubuntu-latest
    # CI-7 — the DB-free smoke spec (homepage render + NG21 404 envelope,
    # tests/e2e/smoke.spec.ts) has its own Playwright project and its own
    # job: it needs only unit-and-build and runs in PARALLEL with the
    # DB-consuming integration + e2e jobs instead of tailing them.
    # No DATABASE_URL / BETTER_AUTH_SECRET / ALLOW_DB_WIPE here — without
    # the auth-fixture env the Playwright globalSetup mutex is a no-op, so
    # this job can never race the shared test database.
    needs: [unit-and-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: E2E smoke (DB-free project)
        run: bun run test:smoke