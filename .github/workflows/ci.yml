# NG23 — CI pipeline: install → types → check → unit tests → build →
# bundle-secrecy proof → e2e (Playwright). All DB-dependent integration
# tests run against a NON-production database (credentials injected as
# GitHub secrets; see B6 integration job extension).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Wrangler types in sync (wrangler.toml ↔ worker-configuration.d.ts)
        run: bun run types:check
      - name: Word-list artifact (src/lib/shared/data/valid-guesses.json)
        run: bun run word-list
      - name: Typecheck
        run: bun run check
      - name: Unit tests (no DB)
        run: bun run test:unit
      - name: Production build (Cloudflare Workers)
        run: bun run build
      - name: Answer-pool secrecy proof (absent from build output)
        run: bun run verify:bundle

  integration:
    runs-on: ubuntu-latest
    needs: unit-and-build
    # B6/B7 external gate — runs the DB integration suite (migration applied
    # first) against a NON-production database; exercises the app's real
    # neon-serverless driver path.
    #
    # Context rules (docs.github.com contexts reference): `secrets` and `env`
    # are NOT available in `jobs.<job_id>.if` (only github/needs/vars/inputs).
    # `secrets` IS available in job-level `env`, and `env` IS available in
    # step-level `if` — so the secret is injected as a job env var and the
    # gate lives on the DB steps. Without the secret the steps skip (job
    # reports success with skipped steps).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Apply migrations (non-production database)
        if: ${{ env.DATABASE_URL != '' }}
        run: bun run db:migrate
      - name: Integration tests (FOR UPDATE, NG9 lock orders, M3, NG2/NG3)
        if: ${{ env.DATABASE_URL != '' }}
        run: bun run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: E2E smoke (production preview → Hono chain)
        run: bun run test:e2e