<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Phase-2 D5/NG5: pre-paint theme application. Runs before first paint;
		     sets `data-theme` on <html> from localStorage['theme'] (explicit
		     choice) or prefers-color-scheme (system default). NG17: keep this a
		     SINGLE script so Phase-5 CSP can allow it by nonce/hash. -->
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
				} catch {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
