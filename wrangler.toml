# Cloudflare Workers configuration — @sveltejs/adapter-cloudflare (Workers Static Assets)
# See https://svelte.dev/docs/kit/adapter-cloudflare
name = "lb"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-23"
# Better Auth requires AsyncLocalStorage (nodejs_compat). NG1 / Architecture-v3.
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# NG1 — Cloudflare Cron is UTC-only. Asia/Manila midnight (UTC+8) = 16:00 UTC.
[triggers]
crons = ["0 16 * * *"]

# Phase-5 S1 (F1) — Workers Rate Limiting API bindings (one per class; the
# simple-limit namespace applies ONE limit per key, so per-class PROPOSED
# limits need per-class namespaces — verified against installed wrangler
# 4.125, which supports `simple` only, period 10|60; see contradictions log
# S1a/S1b). Config key is `ratelimits` in wrangler 4.125 (newer wranglers
# renamed it `rate.limit`; 4.125 rejects the new key with "try upgrading" —
# recorded in the contradictions log S1a). namespace_id is a POSITIVE
# INTEGER STRING that the account defines (docs example "1001"; NOT a UUID —
# S1k-C). These ids (1001–1005) ARE this project's namespace ids — no
# placeholder policy (S1k-D); keep them unique across the account's
# rate-limit bindings. S1k — LEADERBOARD_RATE_LIMITER closes the
# /api/leaderboard/* read-class QA finding (100 req/min per the
# Architecture §Rate limiting read row; contradictions log S1k).
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GAME_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ME_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LEADERBOARD_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 100, period = 60 }

# Phase-6 J-A2 — Analytics Engine dataset for the game-API timing beacon
# (mandatory verification infrastructure, plan §J; timings only, never
# words/secrets/user ids). The operator creates the `latency` dataset;
# binding name LATENCY follows the uppercase binding convention (ASSETS /
# *_RATE_LIMITER). Absent binding ⇒ telemetry no-ops (local/tests/preview).
[[analytics_engine_datasets]]
binding = "LATENCY"
dataset = "latency"

# Phase-6 F.1 — required Worker secrets (defense-in-depth; enforced at
# `wrangler deploy`/`wrangler versions upload`, warning-only in the local
# preview/.dev.vars path so the CI e2e preview is unaffected). Values are
# NEVER in this repo — provisioned per plan §I.3 on the first bootstrap
# (`wrangler versions secret put`/dashboard, not a gate-bypassing `wrangler
# secret put`), `wrangler secret put` afterwards. deploy.yml Gate 5
# (`wrangler secret list` names) remains the explicit pre-deploy gate.
[secrets]
required = ["DATABASE_URL", "BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "ADMIN_EMAIL", "BETTER_AUTH_URL"]
