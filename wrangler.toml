# Cloudflare Workers configuration — @sveltejs/adapter-cloudflare (Workers Static Assets)
# See https://svelte.dev/docs/kit/adapter-cloudflare
name = "leaderboard-wordle"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-23"
# Better Auth requires AsyncLocalStorage (nodejs_compat). NG1 / Architecture-v3.
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# NG1 — Cloudflare Cron is UTC-only. Asia/Manila midnight (UTC+8) = 16:00 UTC.
[triggers]
crons = ["0 16 * * *"]