# Cloudflare Workers configuration — @sveltejs/adapter-cloudflare (Workers Static Assets)
# See https://svelte.dev/docs/kit/adapter-cloudflare
name = "leaderboard-wordle"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-23"
# Better Auth requires AsyncLocalStorage (nodejs_compat). NG1 / Architecture-v3.
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# NG1 — Cloudflare Cron is UTC-only. Asia/Manila midnight (UTC+8) = 16:00 UTC.
[triggers]
crons = ["0 16 * * *"]

# Phase-5 S1 (F1) — Workers Rate Limiting API bindings (one per class; the
# simple-limit namespace applies ONE limit per key, so per-class PROPOSED
# limits need per-class namespaces — verified against installed wrangler
# 4.125, which supports `simple` only, period 10|60; see contradictions log
# S1a/S1b). Config key is `ratelimits` in wrangler 4.125 (newer wranglers
# renamed it `rate.limit`; 4.125 rejects the new key with "try upgrading" —
# recorded in the contradictions log S1a). namespace_id values are
# OPERATOR-PROVISIONED (dashboard/API): replace the placeholders before
# deploy — never invent credentials; exact steps in the Phase-5 handoff.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "00000000-0000-0000-0000-000000000000"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GAME_RATE_LIMITER"
namespace_id = "00000000-0000-0000-0000-000000000000"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ME_RATE_LIMITER"
namespace_id = "00000000-0000-0000-0000-000000000000"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "00000000-0000-0000-0000-000000000000"
simple = { limit = 20, period = 60 }